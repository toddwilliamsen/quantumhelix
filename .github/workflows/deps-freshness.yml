# Continuously verify dependency pins stay on the latest compatible stables.
# The quantum / scientific Python stack matures quickly — fail loudly on drift.
name: Dependency Freshness

on:
  schedule:
    # Mondays 14:00 UTC ≈ 09:00 America/Chicago
    - cron: "0 14 * * 1"
  workflow_dispatch:
  push:
    paths:
      - "requirements.txt"
      - "check_deps.py"
      - ".github/workflows/deps-freshness.yml"

jobs:
  check-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check pins against PyPI
        run: |
          python check_deps.py
          echo "Pins match latest compatible stable releases."

  validate-stack:
    runs-on: ubuntu-latest
    needs: check-deps
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run detection validation suite
        run: python validate.py
